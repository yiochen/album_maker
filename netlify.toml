[build]
  command = "npm run build"
  publish = "dist"

[[plugins]]
  package = "netlify-plugin-cypress"

  [plugins.inputs]
    enable = true
    # Run tests against the served application
    # We use 'start' to run the local dev server during the build process.
    start = "npm run dev"
    wait-on = "http://localhost:5173"
    wait-on-timeout = 120

    # Run Cypress with the 'cypress:run' script.
    # We set CYPRESS_visualRegressionFailSilently=true to prevent deployment failures
    # due to minor rendering differences in the Netlify environment (Linux) vs local.
    # Functional failures will still stop the deploy.
    run = "npm run cypress:ci"

    # Use Electron browser which is bundled with Cypress
    browser = "electron"

    record = false
